name: Release the Android APK

# ONE LINK FOR PLAYTESTERS. Founder, Week 1: "is there a link to the apk I can
# send users?" There wasn't — every APK was built in a session and handed over
# as a file in chat. This builds the same playtest APK in CI and republishes it
# under ONE fixed release tag, so the download URL never changes:
#
#   https://github.com/dachhack/ffgame/releases/download/apk-latest/drip-fantasy.apk
#
# (the repository is public, so the link needs no GitHub account). Each run
# replaces the release — same tag, moved to the built commit — rather than
# stacking a release per build; the version and build number are in the
# release title and notes, and in the APK itself.
#
# Same recipe as the session ritual (docs/next-session-prompt.md): expo
# prebuild → gradle assembleRelease, arm64 only, signed with the committed
# playtest keystore (apps/mobile/plugins/withPlaytestSigning.js), then the
# three checks before anything is published — version code, signer identity,
# and the APP_VERSION string inside the bundle.
#
# versionCode is ANDROID_VERSION_CODE = 40000 + the run number: monotonic, past
# the hand-built sequence (36943 as of v0.390.8), and derived from nothing a
# person has to remember.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Version code (40000 + run number)
        run: echo "ANDROID_VERSION_CODE=$((40000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the SDK; this only accepts licenses and adds
      # platform-tools. The action's default package list includes the retired
      # 'tools' package, which sdkmanager can no longer find (first run, Sep 16)
      # — gradle then pulls the platform and build-tools the project pins.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci

      - name: App version
        id: ver
        run: |
          v=$(node -e "const m=require('fs').readFileSync('packages/core/src/version.ts','utf8').match(/APP_VERSION = '([^']+)'/); console.log(m[1])")
          echo "app=$v" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$v  versionCode=$ANDROID_VERSION_CODE"

      - name: Prebuild (android/)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK (arm64)
        working-directory: apps/mobile/android
        run: |
          # THE LOG HAS TO SURVIVE THE FAILURE. A step's shell is `bash -e`, so
          # `./gradlew … > log` followed by `rc=$?` never reaches `rc=$?` when
          # gradle fails — the shell is already gone, the tail never runs, and
          # the log dies in $RUNNER_TEMP. v0.400.0's build failed in 0.8s and
          # printed NOTHING, which is a build you cannot diagnose. `|| rc=$?`
          # keeps the shell alive long enough to say what happened.
          rc=0
          # Cheap insurance: prebuild generates the wrapper, and a wrapper
          # without its execute bit fails in under a second looking exactly
          # like a compile error that left no log.
          ls -l gradlew gradle/wrapper/gradle-wrapper.jar || true
          chmod +x gradlew || true
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::gradle failed (exit $rc) — the last 200 lines follow"
            tail -200 "$RUNNER_TEMP/gradle.log"
          else
            tail -40 "$RUNNER_TEMP/gradle.log"
          fi
          exit $rc

      - name: Verify before publishing
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          "$bt/aapt2" dump badging "$apk" | grep -o "versionCode='[0-9]*'" | tee "$RUNNER_TEMP/vc"
          grep -q "versionCode='$ANDROID_VERSION_CODE'" "$RUNNER_TEMP/vc" || { echo "::error::versionCode mismatch"; exit 1; }
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs"
          grep -q "CN=Drip Fantasy Playtest" "$RUNNER_TEMP/certs" || { echo "::error::not signed with the playtest key"; exit 1; }
          unzip -p "$apk" assets/index.android.bundle > "$RUNNER_TEMP/bundle.js"
          grep -q "${{ steps.ver.outputs.app }}" "$RUNNER_TEMP/bundle.js" || { echo "::error::APP_VERSION ${{ steps.ver.outputs.app }} not in the bundle"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/drip-fantasy.apk"
          # The app reads this to learn the newest build it could be (core's
          # changelog.ts, APK_MANIFEST_URL) — version, code, and when.
          printf '{"version":"%s","versionCode":%s,"built":"%s"}\n' "${{ steps.ver.outputs.app }}" "$ANDROID_VERSION_CODE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/out/manifest.json"
          cat "$RUNNER_TEMP/out/manifest.json"
          ls -la "$RUNNER_TEMP/out"

      - name: Publish as the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.ver.outputs.app }}
        run: |
          set -euo pipefail
          # NEVER DELETE THE RELEASE (v0.408.0). Founder: "the app downloads
          # from the link but never finished and says failed despite showing
          # all the data transferred."
          #
          # This used to `gh release delete apk-latest --cleanup-tag` and build
          # it again. For the seconds in between, the ONE URL every playtester
          # has — and the one the site's download card points at — is a 404,
          # and the tag it hangs off does not exist. On a quiet week that is a
          # window nobody lands in. On a day like the one that produced this
          # comment it is seven windows in ninety minutes, on the exact link
          # the founder keeps being told to use.
          #
          # Create it only if it is missing, then replace the assets in place.
          # --clobber still removes an asset before re-uploading it, so the
          # window is not zero, but it is one file for a few seconds rather
          # than the whole release plus its tag.
          #
          # The tag stays where it was first cut. That makes the release page's
          # "source code" link point at an older commit, which is a cosmetic
          # cost the notes below already pay off: the exact commit is in them.
          # A stale link on a page beats a dead link in a browser.
          printf '%s\n' \
            "Drip Fantasy Android playtest build." "" \
            "- App version: **$APP**" \
            "- Build (versionCode): **$ANDROID_VERSION_CODE**" \
            "- Commit: $GITHUB_SHA" \
            "- arm64 only · signed with the playtest key · installs over any previous playtest build" "" \
            "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/drip-fantasy.apk" "" \
            "Android asks once to allow installs from your browser (Settings → Install unknown apps)." "" \
            "If the download reaches 100% and then says **Failed**, that is the browser refusing the file, not a broken build. Grab the zip instead and unzip it: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/drip-fantasy.apk.zip" \
            > "$RUNNER_TEMP/notes.md"
          if ! gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create apk-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Drip Fantasy APK · $APP · build $ANDROID_VERSION_CODE" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # A ZIP OF THE SAME APK, alongside it. Chrome on Android runs its own
          # verification over a download whose type says "package archive", and
          # when that verdict does not come back the download is reported
          # FAILED after every byte has already arrived — which is the symptom
          # exactly. A .zip is an ordinary file to every browser, so this is a
          # second door for anyone standing at a closed one: download, unzip,
          # install. Built from the same signed APK, so it is not a different
          # build with the same name.
          (cd "$RUNNER_TEMP/out" && zip -q -X drip-fantasy.apk.zip drip-fantasy.apk)
          gh release upload apk-latest \
            "$RUNNER_TEMP/out/drip-fantasy.apk.zip" \
            "$RUNNER_TEMP/out/manifest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          # WHAT THE CONTENT TYPE IS, AND WHY WE STOPPED FIGHTING IT (v0.409.1).
          #
          # Founder's screenshot: the APK sat at "20.24 MB / 20.24 MB" with a
          # pause icon and never finished, while the identical file handed over
          # in chat installed fine. The two assets on this release differ by one
          # header — the zip comes back as application/octet-stream and
          # downloads normally, the APK as application/vnd.android.package-
          # archive, which is what puts a browser into package-archive handling.
          #
          # v0.409.0 tried to publish the APK as octet-stream through the REST
          # upload, which lets you name a Content-Type. The build log settles
          # it:
          #
          #     APK uploaded as application/octet-stream
          #     drip-fantasy.apk  20243344  application/vnd.android.package-archive
          #
          # The upload was accepted and GitHub re-typed it from the extension
          # regardless. There is no way to serve a file called .apk as anything
          # else from a release, so the experiment is reverted rather than left
          # in place looking like it does something: the zip is the answer, and
          # the site offers it as its own button.
          gh release upload apk-latest "$RUNNER_TEMP/out/drip-fantasy.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/apk-latest" --jq .id)
          # Whatever route it took, the APK has to be ON the release.
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets" \
            --jq '.[] | "\(.name)  \(.size)  \(.content_type)"'
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets" \
            --jq '[.[] | select(.name=="drip-fantasy.apk")] | length' | grep -q '^1$' \
            || { echo "::error::no drip-fantasy.apk on the release"; exit 1; }
          gh release edit apk-latest --repo "$GITHUB_REPOSITORY" --latest \
            --title "Drip Fantasy APK · $APP · build $ANDROID_VERSION_CODE" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/drip-fantasy.apk" >> "$GITHUB_STEP_SUMMARY"
