name: Deploy the worker

# `fly deploy` for the background worker (server/), from CI rather than from
# whichever laptop happens to have flyctl signed in. The deployed commit is a
# fact in the run log instead of a memory, and nobody has to be at a desk.
#
# AUTOMATIC on merge to main — but only when the worker's own code changes (see
# `paths`). This started out as a deliberate click, on the reasoning that
# restarting a process which locks matchups and resolves live games is a
# different class of act from republishing a static page. That reasoning
# protected the wrong risk. A rolling restart is a few seconds of handover and
# every tick re-reads its state, so the restart itself is close to free; what
# actually hurts is deploying a worker that DOESN'T RUN — which is exactly what
# happened when a refactor deleted `log`, `gameDay` and `syncTick` and left the
# call sites behind. `node --check` passed. A green `fly deploy` passed. The
# process died on the first line of main() and nothing noticed for a day.
#
# So the click is replaced by the check that would have caught that: BOOT IT
# FIRST. A deploy that can't get past `boot` doesn't reach Fly. And after Fly,
# the other half of the same question — is it RUNNING? — because a deploy onto
# a stopped machine leaves it stopped and still reports success.
#
# Secret required (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN — fly.io/dashboard → Tokens → Create deploy token, or
#                   `fly tokens create deploy -x 999999h` if you have flyctl.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/core/**'   # the worker runs this engine through tsx
      - 'scripts/espn/**'    # bundled into the image
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'rolling (default) | immediate — immediate is faster but drops the old machine first'
        type: choice
        options: [rolling, immediate]
        default: rolling
      skip_boot_check:
        description: 'Deploy without booting it first (emergencies only)'
        type: boolean
        default: false

# Never two deploys at once, and never a deploy racing the sync/simulate jobs
# that ssh into the same machine.
concurrency: fly-worker

jobs:
  # ── Does it actually start? ────────────────────────────────────────────────
  # The one question no other gate answers. An unresolved identifier in an ES
  # module is a RUNTIME error: it type-checks, it parses, it builds an image,
  # and it throws the moment the line runs. The only way to find out is to run
  # it, so this runs it — against deliberately bogus Supabase credentials, since
  # what's being tested is that the scheduler survives its own first pass, not
  # that it can reach a database.
  boot:
    if: ${{ inputs.skip_boot_check != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install worker deps
        working-directory: server
        run: npm ci
      - name: Engine smoke test
        working-directory: server
        run: npm run --silent smoke
      - name: Boot the scheduler and make sure it stays up
        working-directory: server
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: not-a-real-key
          # Set, so the weekly-sync branch of main() is exercised too — that is
          # where syncTick is called, and where the missing binding lived.
          PILOT_LEAGUE_IDS: '1390853155960389632'
        run: |
          set -uo pipefail
          npx tsx src/index.js > boot.log 2>&1 &
          PID=$!
          # Long enough to clear the player-index build and the first full tick.
          for i in $(seq 1 40); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done

          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            ALIVE=yes
          else
            ALIVE=no
          fi

          echo "── first 40 lines of the worker log ──"
          head -40 boot.log || true

          if [ "$ALIVE" != yes ]; then
            echo "::error::The worker exited during boot. It would deploy and immediately die — see the log above."
            exit 1
          fi
          # Alive isn't sufficient: a process can survive while main() has
          # already thrown and been swallowed. Require the line main() prints.
          if ! grep -q 'worker starting' boot.log; then
            echo "::error::The worker never reached main(). See the log above."
            exit 1
          fi
          echo "Worker booted and was still running after 40s."

  deploy:
    needs: [boot]
    # `always()` so an intentional skip_boot_check run still deploys; the guard
    # is that boot must not have FAILED.
    if: ${{ always() && needs.boot.result != 'failure' && needs.boot.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Set the FLY_API_TOKEN repo secret (Settings → Secrets and variables → Actions). Get one at fly.io/dashboard → Tokens → Create deploy token."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: What we're about to deploy
        run: |
          echo "ref:    ${{ github.ref_name }}"
          echo "commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

      # Push notifications (0150): stage the FCM service-account credential as
      # a Fly secret when the repo secret exists. --stage defers the restart to
      # the deploy right below, so this never causes its own rollout. Absent
      # secret → skipped; the worker enqueues but cannot send, by design.
      # (Guarded in the script, not in `if:` — the secrets context isn't
      # available in step-level if conditions, and referencing it there makes
      # the whole workflow file unparseable: zero jobs, silent no-deploy.)
      - name: stage FCM credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FCM: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM" ]; then
            echo "FCM_SERVICE_ACCOUNT secret not set — skipping (worker will enqueue only)"
            exit 0
          fi
          flyctl secrets set --stage FCM_SERVICE_ACCOUNT="$FCM"

      - name: fly deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # From the repo ROOT: the build context needs packages/core/ and
        # scripts/espn/ as well as server/. Building from server/ would produce
        # an image that starts and then dies on the first engine import.
        run: flyctl deploy --remote-only --strategy "${{ inputs.strategy || 'rolling' }}"

      # ── Is it RUNNING? ────────────────────────────────────────────────────
      # A green `fly deploy` does not mean a running worker. `fly deploy`
      # PRESERVES each machine's prior state: deploy onto a stopped machine and
      # you get "✔ Machine is now in a good state" — where the good state is
      # `stopped`. That is what the very first automated deploy did. The image
      # carrying the boot fix shipped, the run went green, and nothing ran it.
      #
      # A machine ends up stopped by exactly the failure this workflow exists
      # to catch: a worker that keeps dying gets stopped by Fly rather than
      # restarted forever. So the deploy that FIXES the crash is the one that
      # lands on a stopped machine and quietly does nothing.
      #
      # This app is a background poller with no [[services]] — nothing routes
      # traffic to it, so nothing will ever wake it on demand. Stopped means
      # dead. Start anything that isn't started, then assert it.
      - name: Start anything that isn't running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          for id in $(flyctl machines list --json | jq -r '.[] | select(.state != "started") | .id'); do
            echo "Machine $id is not started — starting it."
            flyctl machine start "$id" || true
          done

      - name: Machine status after deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # This step used to be `|| true`, which is how a stopped machine got
        # printed in a green run and went unread for a day. It fails now.
        run: |
          set -uo pipefail
          flyctl status

          # Give a just-started machine a moment before judging it.
          sleep 10
          NOT_STARTED=$(flyctl machines list --json | jq -r '[.[] | select(.state != "started")] | length')
          if [ "$NOT_STARTED" != 0 ]; then
            flyctl machines list
            echo "::error::$NOT_STARTED machine(s) are not in the started state. The image deployed but the worker is not running — check `flyctl logs` for a crash loop."
            exit 1
          fi
          echo "All machines started."

      # ── Is it WORKING? ────────────────────────────────────────────────────
      # Three questions, three separate answers, and this session burned a day
      # discovering they are not the same one:
      #
      #   fly deploy green   an image shipped
      #   state = started    a process exists
      #   these log lines    the process is doing its job
      #
      # `started` was true while the scheduler sat behind a hung ESPN fetch and
      # synced nothing for four days. The only thing that would have shown that
      # is the worker's own output, which lived in `fly logs` on a laptop. It
      # lives in the run log now, so the deploy that breaks the tick is the
      # deploy you can see breaking it.
      #
      # Never fails the job: the machine-state assert above is the gate, and a
      # log stream that hiccups must not turn a good deploy red.
      - name: What the worker is saying
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          # Long enough to clear buildPlayerIndex, the first tick(), and the
          # boot syncTick — the three things worth seeing.
          sleep 75
          echo "── recent worker output ──"
          { timeout 60 flyctl logs --no-tail || timeout 45 flyctl logs || true; } 2>&1 | tail -150
          echo "── end ──"
          echo "Expect: 'worker starting', 'player index built', and — if"
          echo "PILOT_LEAGUE_IDS is set — a 'weekly sync: week N' line. A"
          echo "'no PILOT_LEAGUE_IDS set' line means a stale Fly secret is"
          echo "overriding fly.toml. No sync line at all means the tick above"
          echo "it never returned."
