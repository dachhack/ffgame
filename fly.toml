# Fly config for the 2026 pilot WORKER (server/). Deploy from the repo root:
#   fly deploy
# Set secrets first (see server/DEPLOY.md). No [[services]] — it's a background
# poller with no inbound traffic, so the machine just runs the scheduler.
app = "drip-pilot-worker"
primary_region = "iad"

[build]

[env]
  PILOT_SEASON = "2026"
  # PILOT_SEASON_TYPE is deliberately UNSET. The scheduler runs every week context
  # that currently has games (server/src/index.js activeContexts), so preseason and
  # the regular season poll together and neither needs a flag. Setting it PINS the
  # worker to that one ESPN season type — useful for a one-off debug, dangerous to
  # leave behind: pinned to 1, the regular season never locks or resolves, and the
  # logs look healthy the whole time.
  # Sleeper league ids the worker's weekly auto-sync loop mirrors (syncTick →
  # syncAllLeagues, server/src/index.js). Not a secret, so it lives here rather
  # than in `fly secrets` — the list stays reviewable in git. A same-named Fly
  # secret would OVERRIDE this, so keep it unset (`fly secrets unset
  # PILOT_LEAGUE_IDS`) or the stale secret silently wins. Comma-separated.
  PILOT_LEAGUE_IDS = "1390853155960389632"  # Turf Warriors (12-team SF redraft)

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
