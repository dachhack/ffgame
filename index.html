<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#142A2E" />
    <title>Drip Fantasy — Real-Time Fantasy Football</title>
    <meta
      name="description"
      content="Drip Fantasy is head-to-head fantasy football scored live over real NFL play-by-play. Play it classic — standard scoring, open lineups, every spot locking at its own kickoff — or switch on Drip mode for hidden picks and live effects."
    />
    <link rel="canonical" href="https://dripfantasy.com/" />
    <!-- Brand icons / social (files in public/). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Installable web app. The manifest uses RELATIVE urls so one file serves
         all three bases we build at: dripfantasy.com (/), the /ffgame/ Pages
         preview, and /ffgame-staging/. Icons + service worker: public/icons/pwa,
         public/sw.js (registered from src/app/pwa.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Opaque, 180px (the DF droplet on brand navy) — iOS ignores the manifest
         icons and composites anything transparent onto black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa/apple-touch-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Drip" />
    <!-- "black" (not black-translucent): iOS keeps the web view BELOW the status
         bar, so the sticky header can't end up underneath the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Drip Fantasy" />
    <meta property="og:title" content="Drip Fantasy — Real-Time Fantasy Football" />
    <meta
      property="og:description"
      content="Head-to-head fantasy football, scored live over real NFL play-by-play. Classic scoring and open lineups, or Drip mode's hidden picks and live effects."
    />
    <meta property="og:url" content="https://dripfantasy.com/" />
    <!-- og-card-wide.png is a short 3:1 strip (brand hero + wordmark) so chat unfurls
         (Sleeper, Discord, iMessage) stay compact; Twitter keeps the 1.91:1 og-card.png
         below because it crops non-standard ratios. -->
    <meta property="og:image" content="https://dripfantasy.com/og-card-wide.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="400" />
    <meta property="og:image:alt" content="Drip Fantasy — head-to-head fantasy football, live on real NFL play-by-play" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Drip Fantasy — Real-Time Fantasy Football" />
    <meta name="twitter:description" content="Head-to-head fantasy football, live on real NFL play-by-play. Classic scoring, or Drip mode's hidden picks and live effects." />
    <meta name="twitter:image" content="https://dripfantasy.com/og-card.png" />
    <meta name="twitter:image:alt" content="Drip Fantasy — head-to-head fantasy football, live on real NFL play-by-play" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://dripfantasy.com/#website",
            "url": "https://dripfantasy.com/",
            "name": "Drip Fantasy",
            "description": "Real-time head-to-head fantasy football, live on NFL play-by-play."
          },
          {
            "@type": "VideoGame",
            "name": "Drip Fantasy",
            "url": "https://dripfantasy.com/",
            "image": "https://dripfantasy.com/drip_fantasy_logo3.png",
            "description": "Head-to-head fantasy football scored live over real NFL play-by-play. Classic leagues play standard scoring with open lineups that lock per player at his own kickoff; Drip mode pairs every player with a hidden scoring metric carrying a strategic effect — nuke, erase, hot streak, multiplier.",
            "applicationCategory": "Game",
            "gamePlatform": "Web browser",
            "genre": ["Fantasy sports", "Strategy"],
            "operatingSystem": "Any",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking first paint: fetch as `print`, then promote to
         `all` once loaded. Non-JS agents get the plain stylesheet via <noscript>. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlable / no-JS fallback. The React app replaces #root on load; this
         content is only shown to agents that don't execute the module script. -->
    <noscript>
      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; line-height: 1.5;">
        <h1>Drip Fantasy — Real-Time Fantasy Football</h1>
        <p>
          Drip Fantasy is a head-to-head fantasy football game of <strong>hidden picks</strong> and
          <strong>live effects</strong>. Instead of accumulating raw points, you assign each roster player to a
          game-time window slot and seal a hidden <strong>scoring metric</strong> behind them — one that also carries
          a strategic effect: a <em>nuke</em> that wipes an opponent's banked score, an <em>erase</em> that cancels
          their recent drip, a <em>hot streak</em> that doubles your rate. Your opponent does the same, sealed. When
          the games kick off, picks reveal and effects fire live over real NFL play-by-play.
        </p>
        <p>
          The web demo runs on a genuine 2025 NFL season with real box scores, schedule and scores. Build a lineup
          across the five windows (TNF, Sunday early, Sunday late, SNF, MNF), seal a metric per slot, then watch it
          resolve play by play.
        </p>
        <p><a href="/rulebook/">Read the full scoring rulebook →</a></p>
        <p>This game requires JavaScript to play. Enable JavaScript, then reload <a href="https://dripfantasy.com/">dripfantasy.com</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
